<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        ANTH STUDIOS
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="websites.html">Websites</a>
        <a href="editing.html">Video Editing</a>
        <a href="socials.html" class="active">Socials</a>
    </nav>

</header>


<main>

    <section class="page-hero">

        <div class="hero-glow"></div>

        <p class="hero-small">
            CONNECT WITH US
        </p>

        <h1>
            SOCIALS
        </h1>

        <p>
            Follow Anth Studios and stay connected.
        </p>

    </section>


    <section class="content-section">

        <div class="social-grid">


            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/prod.anth/"
                target="_blank"
                rel="noopener noreferrer"
                class="social-card"
            >

                <div class="social-icon">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="5"
                        ></rect>

                        <circle
                            cx="12"
                            cy="12"
                            r="4"
                        ></circle>

                        <circle
                            cx="17.5"
                            cy="6.5"
                            r="1"
                        ></circle>

                    </svg>

                </div>


                <div>

                    <span>
                        INSTAGRAM
                    </span>

                    <h2>
                        @prod.anth
                    </h2>

                    <p>
                        Follow us on Instagram →
                    </p>

                </div>

            </a>



            <!-- TIKTOK -->

            <a
                href="https://www.tiktok.com/@prod.anth"
                target="_blank"
                rel="noopener noreferrer"
                class="social-card"
            >

                <div class="social-icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M15 3v11a4 4 0 1 1-4-4"></path>

                        <path d="M15 3c1 3 3 4 6 4"></path>

                    </svg>

                </div>


                <div>

                    <span>
                        TIKTOK
                    </span>

                    <h2>
                        @prod.anth
                    </h2>

                    <p>
                        Follow us on TikTok →
                    </p>

                </div>

            </a>


        </div>

    </section>

</main>
